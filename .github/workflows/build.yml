name: Build container image

on:
  push:
    branches:
      - stable
      - testing
    paths-ignore: ["**/README.md"]
  pull_request:
    branches:
      - testing
  workflow_dispatch:
    inputs:
      skip-base:
        description: Skip building Hawaii image
        default: false
        type: boolean
      skip-nvidia:
        description: Skip building Hawaii Nvidia image
        default: false
        type: boolean
      skip-jackrabbit:
        description: Skip building Hawaii Jackrabbit image
        default: false
        type: boolean
      skip-jackrabbit-nvidia:
        description: Skip building Hawaii Jackrabbit Nvidia image
        default: false
        type: boolean
      pull-before-configure:
        description: "Pull from cache before build"
        type: boolean
        default: false
      disable-remote-execution:
        description: "Don't configure remote-execution server (requires valid CASD keys)"
        type: boolean
        default: false

env:
  IMAGE_DESC: "Opinionated niri + bootc image"
  IMAGE_KEYWORDS: "bootc,niri,freedesktop-sdk"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/237492973?s=400&v=4"
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-hawaii:
    name: Build Hawaii Bootc Image
    if: |
      github.event.inputs.skip-base == 'false' || !github.event.inputs.skip-base
    uses: ./.github/workflows/reusable-build-bootc.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image-name: "zirconium-hawaii"
      element-image: "oci/zirconium/image.bst"
      element-stack: "oci/zirconium/stack.bst"
      disable-remote-execution: ${{ inputs.disable-remote-execution == true }}
      publish: ${{ github.event_name != 'pull_request' && ( github.ref == format('refs/heads/stable', github.event.repository.default_branch) || github.ref == format('refs/heads/testing', github.event.repository.default_branch) ) }}

  # Run this build AFTER build-hawaii. build-hawaii will cache all of the base packages.
  build-hawaii-nvidia:
    name: Build Hawaii Nvidia Bootc Image
    if: |
      !failure() && !cancelled() &&
      (github.event.inputs.skip-nvidia == 'false' || !github.event.inputs.skip-nvidia)
    uses: ./.github/workflows/reusable-build-bootc.yml
    needs: build-hawaii
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image-name: "zirconium-hawaii-nvidia"
      element-image: "oci/nvidia/image.bst"
      element-stack: "oci/nvidia/stack.bst"
      disable-remote-execution: ${{ inputs.disable-remote-execution == true }}
      publish: ${{ github.event_name != 'pull_request' && ( github.ref == format('refs/heads/stable', github.event.repository.default_branch) || github.ref == format('refs/heads/testing', github.event.repository.default_branch) ) }}

  build-hawaii-jackrabbit:
    name: Build Hawaii Jackrabbit Bootc Image
    if: |
      !failure() && !cancelled() &&
      (github.event.inputs.skip-jackrabbit == 'false' || !github.event.inputs.skip-jackrabbit)
    uses: ./.github/workflows/reusable-build-bootc.yml
    needs: build-hawaii-nvidia
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image-name: "zirconium-hawaii-jackrabbit"
      element-image: "oci/jackrabbit/image.bst"
      element-stack: "oci/jackrabbit/stack.bst"
      disable-remote-execution: ${{ inputs.disable-remote-execution == true }}
      publish: ${{ github.event_name != 'pull_request' && ( github.ref == format('refs/heads/stable', github.event.repository.default_branch) || github.ref == format('refs/heads/testing', github.event.repository.default_branch) ) }}

  build-hawaii-jackrabbit-nvidia:
    name: Build Hawaii Jackrabbit Nvidia Bootc Image
    if: |
      !failure() && !cancelled() &&
      (github.event.inputs.skip-jackrabbit-nvidia == 'false' || !github.event.inputs.skip-jackrabbit-nvidia)
    uses: ./.github/workflows/reusable-build-bootc.yml
    needs: build-hawaii-jackrabbit
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image-name: "zirconium-hawaii-jackrabbit-nvidia"
      element-image: "oci/jackrabbit-nvidia/image.bst"
      element-stack: "oci/jackrabbit-nvidia/stack.bst"
      disable-remote-execution: ${{ inputs.disable-remote-execution == true }}
      publish: ${{ github.event_name != 'pull_request' && ( github.ref == format('refs/heads/stable', github.event.repository.default_branch) || github.ref == format('refs/heads/testing', github.event.repository.default_branch) ) }}
