name: zirconium

# Required BuildStream version
min-version: 2.6

# Subdirectory where elements are stored
element-path: elements

(@):
  - freedesktop-sdk.bst:include/runtime.yml
  - include/aliases.yml
  - gnome-build-meta.bst:include/recc.yml

options:
  arch:
    type: arch
    description: Machine architecture
    variable: arch
    values:
      - aarch64
      - x86_64
  recc:
    type: enum
    description: |
      configuration to use for RECC

      * passthrough: call compiler directly (useful to check if the issue is in RECC)
      * cache-only: check if the build is in the cache, otherwise call the compiler
                    locally (in the same sandbox).
      * remote-execution: check if the build is in the cache, otherwise run remotely
                          (in a separate sandbox) and cache the result.
      * upload-local-build: check if the build is in the cache, otherwise call the compiler
                            locally and cache the result (faster but more dangerous)
    values:
    - passthrough
    - cache-only
    - remote-execution
    - upload-local-build
    # FIXME: set this to "remote-execution" whenever this is properly set up for zirconium-hawaii
    default: passthrough

fatal-warnings:
- overlaps
- unaliased-url
- unstaged-files

sandbox:
  build-arch: "%{arch}"

variables:
  (@):
  - freedesktop-sdk.bst:include/repo_branches.yml
  - include/variables.yml
  - include/image-version.yml
  (?):
    - arch == "x86_64":
        go-arch: "amd64"
        systemd-arch: "x86-64"
    - arch == "aarch64":
        go-arch: "arm64"
        systemd-arch: "arm64"
    - arch == "ppc64le":
        gcc_arch: "powerpc64le"
        go-arch: "ppc64le"
        systemd-arch: "ppc64-le"
    - arch == "riscv64":
        go-arch: "riscv64"
        systemd-arch: "riscv64"

# Project name

# The uri to download built artifacts from for this project
artifacts:
  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 60
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

source-caches:
  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 60
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

plugins:
  - origin: junction
    junction: plugins/buildstream-plugins.bst
    elements:
      - autotools
      - meson
      - cmake
      - make
    sources:
      - patch
      - docker

  - origin: junction
    junction: plugins/buildstream-plugins-community.bst
    elements:
      - cargo
      - collect_manifest
      - flatpak_image
      - flatpak_repo
      - ostree
      - pyproject
    sources:
      - gen_cargo_lock
      - cargo2
      - git_module
      - git_repo
      - zip

  - origin: junction
    junction: gnome-build-meta.bst
    elements:
      - collect_initial_scripts

  - origin: local
    path: plugins
    sources:
      - patch_queue
      - remote_patch

sources:
  git_repo:
    config:
      ref-format: git-describe
  cargo2:
    config:
      url: crates:crates
      git-mirrors:
        https://github.com/: "github:"
        https://gitlab.com/: "gitlab:"
        https://codeberg.org/: "codeberg:"

junctions:
  internal:
  - plugins/buildstream-plugins.bst
  - plugins/buildstream-plugins-community.bst
